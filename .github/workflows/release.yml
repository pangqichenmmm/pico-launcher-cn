name: Publish Pico Launcher CN files

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/nightly.yml
  publish:
    name: Attach directly usable files
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: Pico_Launcher_CN
          path: release-files
      - name: Attach program and notices individually
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release-files/_picoboot.nds
            release-files/SHA256SUMS.txt
            release-files/INSTALL-CN.txt
            release-files/LICENSE.txt
            release-files/FONT-OFL-1.1.txt
            release-files/FONT-NOTICE.txt
            release-files/THIRD-PARTY-LICENSES.txt
            release-files/validation.json
            release-files/native-tests.txt
