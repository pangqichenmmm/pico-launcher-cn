name: Build Pico Launcher CN

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [develop, chinese-filename]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pico_launcher:
    name: Build and verify Chinese filename edition
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out sources and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install font validation dependencies
        run: python -m pip install -r tools/requirements-fonts.txt
      - name: Prepare pinned native BlocksDS toolchain
        run: python -B tools/bootstrap_windows.py
      - name: Build menu
        run: python -B tools/build_windows.py
      - name: Test actual C++ text renderer
        run: python -B tools/test_windows.py
      - name: Verify fonts and menu binary
        run: python -B tools/verify_and_preview.py
      - name: Prepare program, checksums and notices
        run: python -B tools/package_cn.py
      - name: Save verified build
        uses: actions/upload-artifact@v4
        with:
          name: Pico_Launcher_CN
          path: releases/0.1.1-filename-test/
          if-no-files-found: error
